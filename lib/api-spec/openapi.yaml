openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication
  - name: Feedback
    description: Customer category feedback
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - type: "null"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to identity provider }
  /callback:
    get:
      tags: [Auth]
      operationId: completeBrowserLogin
      responses:
        "302": { description: Redirect home after login }
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to logout provider }
  /feedback:
    get:
      tags: [Feedback]
      operationId: listFeedback
      parameters:
        - name: category
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FeedbackCategory"
      responses:
        "200":
          description: Newest feedback (at most 100)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedbackItem"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Feedback]
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, text]
              properties:
                category:
                  $ref: "#/components/schemas/FeedbackCategory"
                text:
                  type: string
                  minLength: 3
                  maxLength: 2000
                imagePath:
                  type: string
      responses:
        "201":
          description: Created feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackItem"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /feedback/upload:
    post:
      tags: [Feedback]
      operationId: requestFeedbackUpload
      description: Direct PUT to signed URL with matching Content-Type. URL expires after 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, size]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                size:
                  type: integer
                  minimum: 1
                  maximum: 5242880
      responses:
        "200":
          description: Pending upload
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL: { type: string }
                  objectPath: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /feedback/{id}:
    delete:
      tags: [Feedback]
      operationId: deleteFeedback
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /feedback/images/{id}:
    get:
      tags: [Feedback]
      operationId: getFeedbackImage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Published image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    FeedbackCategory:
      type: string
      enum: [cups, perfumes, beauty, cosmetics, bodycare, flowers, printing]
    FeedbackItem:
      type: object
      required: [id, category, authorName, text, imageUrl, createdAt, canDelete]
      properties:
        id: { type: string }
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        authorName: { type: string }
        text: { type: string }
        imageUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        canDelete: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

